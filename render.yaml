services:
  - type: web
    name: product-strategy-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r product-strategy-assistant/requirements.txt
    startCommand: streamlit run product-strategy-assistant/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://keygateway.arshnivlabs.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
